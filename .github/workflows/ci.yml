name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: python -m pip install -r services/api/requirements.lock.txt
      - name: API and planner tests (AI uses a fake model; no Ollama in CI)
        run: PYTHONPATH=services/api python -m pytest -q services/api/tests
      - name: Demo fixtures are reproducible
        run: |
          PYTHONPATH=services/api python scripts/export_demo_fixtures.py
          git diff --exit-code -- apps/web/demo/fixtures.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: TypeScript planner matches the Python planner
        run: npm run test:parity
      - name: Live build
        run: npm run build
      - name: Public demo build
        run: NEXT_DIST_DIR=.next-demo NEXT_PUBLIC_DEMO_MODE=1 npm run build
      - run: npm audit --omit=dev --audit-level=high
