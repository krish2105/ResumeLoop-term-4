name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: python -m pip install -r services/api/requirements.lock.txt
      - name: API and planner tests (AI uses a fake model; no Ollama in CI)
        run: PYTHONPATH=services/api python -m pytest -q services/api/tests
      - name: Demo fixtures are reproducible
        run: |
          PYTHONPATH=services/api python scripts/export_demo_fixtures.py
          git diff --exit-code -- apps/web/demo/fixtures.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: TypeScript planner matches the Python planner
        run: npm run test:parity && node --no-warnings scripts/ics-check.ts
      - name: Live build
        run: npm run build
      - name: Public demo build
        run: NEXT_DIST_DIR=.next-demo NEXT_PUBLIC_DEMO_MODE=1 npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    # End-to-end checks in a real browser. No Ollama on CI runners, so this exercises every
    # offline fallback path (digest text, keyword retrieval, template drafts).
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.lock.txt
      - run: npm ci && npm run build
        working-directory: apps/web
      - name: Start API and web
        run: |
          DEMO_DB_PATH=$RUNNER_TEMP/ci.sqlite3 PYTHONPATH=services/api nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8014 > $RUNNER_TEMP/api.log 2>&1 &
          (cd apps/web && nohup npm run start -- --hostname 127.0.0.1 --port 3000 > $RUNNER_TEMP/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8014/api/health && curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      - name: Browser smoke suite
        run: |
          npx --yes --package @playwright/cli playwright-cli install-browser chromium
          npx --yes --package @playwright/cli playwright-cli --session ci open http://127.0.0.1:3000
          npx --yes --package @playwright/cli playwright-cli --session ci run-code "$(cat scripts/browser-smoke.js)" | tee $RUNNER_TEMP/smoke.txt
          grep -q '"kind":"SYNTHETIC ENGINEERING VERIFICATION"' $RUNNER_TEMP/smoke.txt
      - name: Accessibility scan (axe, 24 routes x light/dark x 1440/320)
        run: |
          npm install --prefix $RUNNER_TEMP/axe axe-core@4 >/dev/null
          npx --yes --package @playwright/cli playwright-cli --session ci run-code "$(sed "s#AXE_PATH#$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js#" scripts/accessibility-smoke.js)" | tee $RUNNER_TEMP/axe.txt
          grep -q '"scans_with_violations":0' $RUNNER_TEMP/axe.txt
      - name: Browser pilot on the public-demo build
        run: |
          (cd apps/web && NEXT_DIST_DIR=.next-demo NEXT_PUBLIC_DEMO_MODE=1 npm run build)
          (cd apps/web && NEXT_DIST_DIR=.next-demo nohup npm run start -- --hostname 127.0.0.1 --port 3001 > $RUNNER_TEMP/demo.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3001/ && break; sleep 2; done
          npx --yes --package @playwright/cli playwright-cli --session pilot open http://127.0.0.1:3001
          npx --yes --package @playwright/cli playwright-cli --session pilot run-code "$(cat scripts/pilot-smoke.js)" | tee $RUNNER_TEMP/pilot.txt
          grep -q '"kind":"SYNTHETIC ENGINEERING VERIFICATION"' $RUNNER_TEMP/pilot.txt
      - name: Cross-browser smoke suite (WebKit for Safari, Firefox)
        run: |
          for b in webkit firefox; do
            pkill -f "uvicorn app.main:app" || true; sleep 1
            DEMO_DB_PATH=$RUNNER_TEMP/$b.sqlite3 PYTHONPATH=services/api nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8014 > $RUNNER_TEMP/api.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8014/api/health >/dev/null && break; sleep 1; done
            npx --yes --package @playwright/cli playwright-cli install-browser --with-deps $b
            npx --yes --package @playwright/cli playwright-cli --session $b open --browser $b http://127.0.0.1:3000
            npx --yes --package @playwright/cli playwright-cli --session $b run-code "$(cat scripts/browser-smoke.js)" | tee $RUNNER_TEMP/smoke-$b.txt
            grep -q '"kind":"SYNTHETIC ENGINEERING VERIFICATION"' $RUNNER_TEMP/smoke-$b.txt
          done
      - if: failure()
        run: tail -50 $RUNNER_TEMP/api.log $RUNNER_TEMP/web.log || true
